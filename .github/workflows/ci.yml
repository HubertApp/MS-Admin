name: CI

on:
  push:
  pull_request:

# Un nouveau push sur une branche déjà en cours de test annule le run précédent,
# pour ne pas empiler les jobs sur une série de commits rapprochés.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Le workflow ne fait que lire le dépôt : le GITHUB_TOKEN est restreint en lecture.
permissions:
  contents: read

jobs:
  tests:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked échoue si uv.lock n'est plus cohérent avec pyproject.toml et
      # --no-build n'installe que des wheels, sans exécuter de script de build.
      # uv installe au passage la version de Python fixée par .python-version.
      - name: Installer les dépendances
        run: uv sync --group dev --locked --no-build

      - name: Lint
        run: uv run --locked --no-build ruff check .

      # La suite tourne hors ligne (MongoDB, RabbitMQ et l'API externe sont
      # simulés) : aucun service ni conteneur n'est nécessaire. Le seuil de
      # couverture (85 %) est défini dans pyproject.toml.
      - name: Tests
        run: uv run --locked --no-build pytest -q --cov

  # L'image ne part sur le registre que si le job ci-dessus est vert (needs) et
  # seulement depuis main et develop : une branche de travail ne publie rien.
  build-and-push:
    name: Docker build & push
    needs: tests
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # L'étiquette :<sha> est ce qui rend un retour arrière possible : chaque
      # image reste rattachée de façon immuable à son commit. Le nom d'image est
      # propre à CE service — le recopier d'un autre dépôt écraserait son image.
      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ms-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ms-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
